name: PR pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: ./.github/actions/setup-jdk
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v5
      continue-on-error: true
      with:
        directory: .
        maven-args: "-DmergeClassifiers=true"

  format:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: ./.github/actions/setup-jdk
      - name: Check formatting
        # -nsu: пропустить проверку snapshot-репозиториев (в проекте нет
        # SNAPSHOT-зависимостей) — меньше сетевых обращений, быстрее старт.
        run: mvn -B -nsu spotless:check --file pom.xml

  lint:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: ./.github/actions/setup-jdk
      - name: Restore checkstyle cache
        uses: actions/cache@v5
        with:
          # Инкрементальный кеш checkstyle (cacheFile из pom.xml): при
          # неизменённых исходниках аудит пропускается. Ключ — по конфигам,
          # fallback — любой предыдущий кеш (устаревшие записи checkstyle
          # перепроверяет по хешам файлов сам).
          path: target/checkstyle-cachefile
          key: checkstyle-${{ hashFiles('checkstyle.xml', 'pom.xml') }}
          restore-keys: checkstyle-
      - name: Check lint
        # -nsu: не опрашивать snapshot-репозитории (apache.snapshots тянется
        # из родительского apache-pom цепочки плагина): в проекте нет
        # SNAPSHOT-зависимостей, а каждый артефакт иначе даёт лишний сетевой
        # round-trip — это и есть основная задержка из Issue #31.
        run: mvn -B -nsu checkstyle:check --file pom.xml

  junit:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: ./.github/actions/setup-jdk
      - name: Run tests
        run: mvn -B test --file pom.xml